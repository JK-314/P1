name: eatsence
description: Anonymous persona-based social matching app with 3-Step Bridge Matching System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.8.0

  # Routing
  go_router: ^14.6.2

  # Data Modeling
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional Programming (Either pattern)
  fpdart: ^1.1.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2

  # Linting
  flutter_lints: ^5.0.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
